<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8FF00"/>
      <stop offset="100%" stop-color="#3a4200"/>
    </linearGradient>
    <filter id="cardGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>

  <!-- glow border -->
  <rect x="12" y="12" width="876" height="336" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" opacity="0.9"/>
  <rect x="12" y="12" width="876" height="336" rx="18" fill="none" stroke="#C8FF00" stroke-width="1" opacity="0.35" filter="url(#cardGlow)"/>

  <!-- card body -->
  <rect x="16" y="16" width="868" height="328" rx="16" fill="url(#cardBg)"/>

  <!-- corner ticks -->
  <g stroke="#C8FF00" stroke-width="2" opacity="0.8">
    <path d="M 16 46 L 16 16 L 46 16" fill="none"/>
    <path d="M 854 16 L 884 16 L 884 46" fill="none"/>
    <path d="M 884 314 L 884 344 L 854 344" fill="none"/>
    <path d="M 46 344 L 16 344 L 16 314" fill="none"/>
  </g>

  <text x="48" y="60" font-family="JetBrains Mono, Fira Code, monospace" font-size="13" fill="#5c5c5c" letter-spacing="2">IDENTITY CARD // 001</text>
  <circle cx="852" cy="55" r="5" fill="#C8FF00"/>
  <text x="800" y="60" font-family="JetBrains Mono, Fira Code, monospace" font-size="12" fill="#C8FF00" text-anchor="end" letter-spacing="1">ACTIVE</text>

  <line x1="48" y1="80" x2="852" y2="80" stroke="#242424" stroke-width="1"/>

  <g font-family="JetBrains Mono, Fira Code, monospace" font-size="15">
    <text x="48" y="130" fill="#6b6b6b" letter-spacing="1">NAME</text>
    <text x="220" y="130" fill="#F3F1EB" font-weight="600">MUHAMMAD ABDAL</text>

    <text x="48" y="165" fill="#6b6b6b" letter-spacing="1">ROLE</text>
    <text x="220" y="165" fill="#F3F1EB">SOFTWARE ENGINEER</text>

    <text x="48" y="200" fill="#6b6b6b" letter-spacing="1">MEDIUM</text>
    <text x="220" y="200" fill="#C8FF00">FLUTTER</text>

    <text x="48" y="235" fill="#6b6b6b" letter-spacing="1">FOCUS</text>
    <text x="220" y="235" fill="#C8FF00">ARTIFICIAL INTELLIGENCE</text>

    <text x="48" y="270" fill="#6b6b6b" letter-spacing="1">APPROACH</text>
    <text x="220" y="270" fill="#F3F1EB">PRODUCT FIRST</text>

    <text x="48" y="305" fill="#6b6b6b" letter-spacing="1">STATUS</text>
    <text x="220" y="305" fill="#F3F1EB">OPEN TO WORK</text>
  </g>

  <rect x="770" y="290" width="82" height="24" rx="4" fill="none" stroke="#C8FF00" stroke-width="1"/>
  <text x="811" y="306" font-family="JetBrains Mono, monospace" font-size="11" fill="#C8FF00" text-anchor="middle" letter-spacing="1">● LIVE</text>
</svg>
