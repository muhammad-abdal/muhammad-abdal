<svg width="1000" height="200" viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="nodeGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="200" fill="#0a0a0a" rx="16"/>

  <!-- connecting line -->
  <line x1="90" y1="90" x2="910" y2="90" stroke="#242424" stroke-width="2"/>
  <line x1="90" y1="90" x2="910" y2="90" stroke="#C8FF00" stroke-width="1" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- 6 nodes -->
  <g font-family="JetBrains Mono, Fira Code, monospace">
    <!-- node template x positions: 90,254,418,582,746,910 -->
    <g>
      <circle cx="90" cy="90" r="7" fill="#0a0a0a" stroke="#C8FF00" stroke-width="2" filter="url(#nodeGlow)"/>
      <text x="90" y="130" font-size="11" fill="#6b6b6b" text-anchor="middle" letter-spacing="1">01</text>
      <text x="90" y="155" font-size="14" fill="#F3F1EB" text-anchor="middle" font-weight="700">DEFINE</text>
    </g>
    <g>
      <circle cx="254" cy="90" r="7" fill="#0a0a0a" stroke="#C8FF00" stroke-width="2" filter="url(#nodeGlow)"/>
      <text x="254" y="130" font-size="11" fill="#6b6b6b" text-anchor="middle" letter-spacing="1">02</text>
      <text x="254" y="155" font-size="14" fill="#F3F1EB" text-anchor="middle" font-weight="700">MODEL</text>
    </g>
    <g>
      <circle cx="418" cy="90" r="7" fill="#0a0a0a" stroke="#C8FF00" stroke-width="2" filter="url(#nodeGlow)"/>
      <text x="418" y="130" font-size="11" fill="#6b6b6b" text-anchor="middle" letter-spacing="1">03</text>
      <text x="418" y="155" font-size="14" fill="#F3F1EB" text-anchor="middle" font-weight="700">ARCHITECT</text>
    </g>
    <g>
      <circle cx="582" cy="90" r="7" fill="#0a0a0a" stroke="#C8FF00" stroke-width="2" filter="url(#nodeGlow)"/>
      <text x="582" y="130" font-size="11" fill="#6b6b6b" text-anchor="middle" letter-spacing="1">04</text>
      <text x="582" y="155" font-size="14" fill="#F3F1EB" text-anchor="middle" font-weight="700">BUILD</text>
    </g>
    <g>
      <circle cx="746" cy="90" r="7" fill="#0a0a0a" stroke="#C8FF00" stroke-width="2" filter="url(#nodeGlow)"/>
      <text x="746" y="130" font-size="11" fill="#6b6b6b" text-anchor="middle" letter-spacing="1">05</text>
      <text x="746" y="155" font-size="14" fill="#F3F1EB" text-anchor="middle" font-weight="700">INTEGRATE</text>
    </g>
    <g>
      <circle cx="910" cy="90" r="8" fill="#C8FF00" filter="url(#nodeGlow)">
        <animate attributeName="r" values="8;10;8" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="910" y="130" font-size="11" fill="#6b6b6b" text-anchor="middle" letter-spacing="1">06</text>
      <text x="910" y="155" font-size="14" fill="#C8FF00" text-anchor="middle" font-weight="700">SHIP</text>
    </g>
  </g>
</svg>
