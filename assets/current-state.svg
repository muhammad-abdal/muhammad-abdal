<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="sGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="10" y="10" width="880" height="280" rx="16" fill="url(#sBg)" stroke="#242424" stroke-width="1.5"/>
  <rect x="10" y="10" width="880" height="280" rx="16" fill="none" stroke="#C8FF00" stroke-width="1" opacity="0.3" filter="url(#sGlow)"/>

  <text x="42" y="48" font-family="JetBrains Mono, monospace" font-size="13" fill="#6b6b6b" letter-spacing="2">CURRENT MODE</text>
  <text x="42" y="82" font-family="JetBrains Mono, monospace" font-size="26" fill="#C8FF00" font-weight="700" letter-spacing="2">BUILDING</text>

  <circle cx="838" cy="45" r="5" fill="#C8FF00">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="822" y="50" font-family="JetBrains Mono, monospace" font-size="12" fill="#C8FF00" text-anchor="end" letter-spacing="1">ACTIVE</text>

  <line x1="42" y1="102" x2="858" y2="102" stroke="#242424" stroke-width="1"/>

  <g font-family="JetBrains Mono, monospace" font-size="14">
    <text x="42" y="140" fill="#6b6b6b" letter-spacing="1">PRIMARY STACK</text>
    <text x="858" y="140" fill="#F3F1EB" text-anchor="end">FLUTTER / DART</text>

    <text x="42" y="170" fill="#6b6b6b" letter-spacing="1">INTELLIGENCE</text>
    <text x="858" y="170" fill="#F3F1EB" text-anchor="end">AI / GEMINI</text>

    <text x="42" y="200" fill="#6b6b6b" letter-spacing="1">ARCHITECTURE</text>
    <text x="858" y="200" fill="#F3F1EB" text-anchor="end">CLEAN / FEATURE-FIRST</text>

    <text x="42" y="230" fill="#6b6b6b" letter-spacing="1">STATE</text>
    <text x="858" y="230" fill="#F3F1EB" text-anchor="end">GETX / RIVERPOD</text>

    <text x="42" y="260" fill="#6b6b6b" letter-spacing="1">BACKEND</text>
    <text x="858" y="260" fill="#F3F1EB" text-anchor="end">FIREBASE / SUPABASE</text>
  </g>
</svg>
