<svg width="1000" height="460" viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="mBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="mGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="10" y="10" width="980" height="440" rx="18" fill="url(#mBg)" stroke="#242424" stroke-width="1.5"/>
  <rect x="10" y="10" width="980" height="440" rx="18" fill="none" stroke="#C8FF00" stroke-width="1" opacity="0.25" filter="url(#mGlow)"/>

  <!-- grid lines: 3 cols x 2 rows -->
  <line x1="343" y1="10" x2="343" y2="450" stroke="#242424" stroke-width="1"/>
  <line x1="676" y1="10" x2="676" y2="450" stroke="#242424" stroke-width="1"/>
  <line x1="10" y1="230" x2="990" y2="230" stroke="#242424" stroke-width="1"/>

  <!-- cell template repeated manually -->
  <g font-family="JetBrains Mono, Fira Code, monospace">

    <!-- 01 MOBILE -->
    <text x="45" y="60" font-size="13" fill="#C8FF00" letter-spacing="2">01</text>
    <text x="45" y="100" font-size="22" fill="#F3F1EB" font-weight="700" letter-spacing="1">MOBILE</text>
    <text x="45" y="135" font-size="13" fill="#8a8a8a">Flutter · Dart · Android</text>

    <!-- 02 INTELLIGENCE -->
    <text x="378" y="60" font-size="13" fill="#C8FF00" letter-spacing="2">02</text>
    <text x="378" y="100" font-size="22" fill="#F3F1EB" font-weight="700" letter-spacing="1">INTELLIGENCE</text>
    <text x="378" y="135" font-size="13" fill="#8a8a8a">Gemini AI · Integration</text>

    <!-- 03 DATA -->
    <text x="711" y="60" font-size="13" fill="#C8FF00" letter-spacing="2">03</text>
    <text x="711" y="100" font-size="22" fill="#F3F1EB" font-weight="700" letter-spacing="1">DATA</text>
    <text x="711" y="135" font-size="13" fill="#8a8a8a">Firebase · Supabase · Dio</text>

    <!-- 04 ENGINEERING -->
    <text x="45" y="290" font-size="13" fill="#C8FF00" letter-spacing="2">04</text>
    <text x="45" y="330" font-size="22" fill="#F3F1EB" font-weight="700" letter-spacing="1">ENGINEERING</text>
    <text x="45" y="365" font-size="13" fill="#8a8a8a">Clean Arch · Feature-First</text>

    <!-- 05 STATE -->
    <text x="378" y="290" font-size="13" fill="#C8FF00" letter-spacing="2">05</text>
    <text x="378" y="330" font-size="22" fill="#F3F1EB" font-weight="700" letter-spacing="1">STATE</text>
    <text x="378" y="365" font-size="13" fill="#8a8a8a">GetX · Riverpod · GoRouter</text>

    <!-- 06 TOOLING -->
    <text x="711" y="290" font-size="13" fill="#C8FF00" letter-spacing="2">06</text>
    <text x="711" y="330" font-size="22" fill="#F3F1EB" font-weight="700" letter-spacing="1">TOOLING</text>
    <text x="711" y="365" font-size="13" fill="#8a8a8a">Git · VS Code · Postman</text>
  </g>

  <!-- small accent dots per cell -->
  <g fill="#C8FF00">
    <circle cx="320" cy="45" r="3"/>
    <circle cx="653" cy="45" r="3"/>
    <circle cx="965" cy="45" r="3"/>
    <circle cx="320" cy="265" r="3"/>
    <circle cx="653" cy="265" r="3"/>
    <circle cx="965" cy="265" r="3"/>
  </g>
</svg>
